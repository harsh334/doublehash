<div class="comment-overlay">
    <div class="comment-box" (click)="$event.stopPropagation()">
        <div class="spinner" *ngIf="isSpinnerVisible">
            <i class="fa fa-spinner fa-pulse fa-3x fa-fw"></i>
            <span class="sr-only">Loading...</span>
        </div>
        <div class="header-and-comments">
            <div class="comment-header">
                <h2>Comments</h2>
                <button class="close-btn" (click)="close()">
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <div class="comments">
                <p class=".text-muted" *ngIf="comment.length == 0">
                    No comments yet
                </p>
                <div *ngFor="let singleComment of comment" class="comment">
                    <div class="user-profile">
                        <div class="user-profile-image">
                            <img
                                src="{{
                                    singleComment['profileImage']
                                        ? singleComment['profileImage']
                                        : defaultImage
                                }}"
                                alt="image"
                            />
                        </div>
                        <div class="username">
                            {{ singleComment["userName"] }}
                        </div>
                    </div>
                    <div class="description">
                        {{ singleComment["description"] }}
                    </div>
                </div>
            </div>
        </div>
        <div class="add-comments">
            <form
                class="comment-form"
                [formGroup]="commentForm"
                (ngSubmit)="addComment(postID, commentForm.value)"
            >
                <input
                    #commentBox
                    type="text"
                    name="commentBox"
                    id="commentBox"
                    formControlName="commentText"
                    placeholder="Add comment"
                />
                <button
                    [class]="
                        commentForm.get('commentText')?.value &&
                        !isSpinnerVisible
                            ? 'comment-btn'
                            : 'disabled-btn'
                    "
                    id="commentBtn"
                    [disabled]="
                        !commentForm.get('commentText')?.value ||
                        isSpinnerVisible
                    "
                >
                    <i class="fa fa-plus" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </div>
</div>
